<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendamento Barbearia</title>

<style>
* { box-sizing: border-box; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #2c3e50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.container {
  width: 100%;
  max-width: 480px;
  background: #ffffff;
  padding: 30px 28px;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 26px;
  font-weight: 700;
}

label {
  display: block;
  margin-top: 18px;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #dfe6e9;
  margin-top: 6px;
  font-size: 15px;
}

.servico {
  background: #f7f9fc;
  padding: 14px;
  border-radius: 12px;
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

input[type="checkbox"] {
  accent-color: #6c5ce7;
}

.total {
  margin-top: 20px;
  font-size: 20px;
  font-weight: 700;
  text-align: right;
}

.horarios {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.horario {
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

.livre { background: #00b894; color: #fff; }
.ocupado { background: #d63031; color: #fff; opacity: .6; cursor: not-allowed; }
.selecionado { background: #fdcb6e; color: #000; }

button {
  width: 100%;
  margin-top: 28px;
  padding: 16px;
  border-radius: 14px;
  background: #6c5ce7;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
<h1>BARBEARIA NOVAKOSKI</h1>

<label>Nome</label>
<input id="nome">

<label>Serviços</label>

<div class="servico"><label><input type="checkbox" data-preco="30" value="Corte"> Corte</label><span>R$30</span></div>
<div class="servico"><label><input type="checkbox" data-preco="80" value="Luzes"> Luzes</label><span>R$80</span></div>
<div class="servico"><label><input type="checkbox" data-preco="15" value="Pezinho"> Pezinho</label><span>R$15</span></div>
<div class="servico"><label><input type="checkbox" data-preco="40" value="Pigmentação"> Pigmentação</label><span>R$40</span></div>
<div class="servico"><label><input type="checkbox" data-preco="20" value="Sobrancelha"> Sobrancelha</label><span>R$20</span></div>

<div class="total" id="total">Total: R$0</div>

<label>Data</label>
<input type="date" id="data">

<label>Horário</label>
<div class="horarios" id="horarios"></div>

<button onclick="agendar()">Agendar</button>
</div>

<script>
const horariosFixos = ["09:00","10:00","11:00","14:00","15:00","16:00"];
let horarioSelecionado = null;

document.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = calcular);
document.getElementById("data").onchange = validarDia;

function calcular(){
  let total = 0;
  document.querySelectorAll("input[type=checkbox]").forEach(c=>{
    if(c.checked) total += Number(c.dataset.preco);
  });
  document.getElementById("total").innerText = "Total: R$" + total;
}

function validarDia(){
  carregarHorarios();
}

function carregarHorarios(){
  const div = document.getElementById("horarios");
  div.innerHTML = "";
  horarioSelecionado = null;

  const data = document.getElementById("data").value;
  const ag = JSON.parse(localStorage.getItem("agendamentos")) || [];

  horariosFixos.forEach(h=>{
    const ocupado = ag.some(a => a.data === data && a.hora === h);
    const b = document.createElement("button");
    b.innerText = h;
    b.className = "horario " + (ocupado ? "ocupado" : "livre");
    if(!ocupado) b.onclick = () => selecionar(b,h);
    div.appendChild(b);
  });
}

function selecionar(botao,h){
  document.querySelectorAll(".horario").forEach(b=>b.classList.remove("selecionado"));
  botao.classList.add("selecionado");
  horarioSelecionado = h;
}

function agendar(){
  const nome = document.getElementById("nome").value;
  const data = document.getElementById("data").value;

  const servicos = [];
  let total = 0;

  document.querySelectorAll("input[type=checkbox]").forEach(c=>{
    if(c.checked){
      servicos.push(c.value);
      total += Number(c.dataset.preco);
    }
  });

  if(!nome || !data || !horarioSelecionado || servicos.length===0){
    alert("Preencha tudo");
    return;
  }

  const ag = JSON.parse(localStorage.getItem("agendamentos")) || [];

  ag.push({
    nome,
    data,
    hora: horarioSelecionado,
    servicos,
    total
  });

  localStorage.setItem("agendamentos", JSON.stringify(ag));

  alert("Agendado com sucesso");
  carregarHorarios();
}
</script>

</body>
</html>
