<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento Barbearia</title>

<style>
* { box-sizing: border-box; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}

.container {
  width: 100%;
  max-width: 480px;
  background: #fff;
  padding: 30px 28px;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 26px;
}

label {
  display: block;
  margin-top: 18px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #dfe6e9;
  margin-top: 6px;
}

.servico {
  background: #f7f9fc;
  padding: 14px;
  border-radius: 12px;
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

.total {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
  color: #00b894;
  text-align: right;
}

.horarios {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 15px;
}

.horario {
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.livre { background: #00b894; color: #fff; }
.ocupado { background: #d63031; color: #fff; opacity: .6; cursor: not-allowed; }
.selecionado { background: #fdcb6e; color: #000; }

button {
  width: 100%;
  margin-top: 28px;
  padding: 16px;
  border-radius: 14px;
  background: #6c5ce7;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  border: none;
}
</style>
</head>

<body>

<div class="container">
<h1>BARBEARIA NOVAKOSKI</h1>

<label>Nome</label>
<input id="nome">

<label>Serviços</label>
<div class="servico"><label><input type="checkbox" data-preco="30" value="Corte"> Corte</label><span>R$30</span></div>
<div class="servico"><label><input type="checkbox" data-preco="80" value="Luzes"> Luzes</label><span>R$80</span></div>
<div class="servico"><label><input type="checkbox" data-preco="15" value="Pezinho"> Pezinho</label><span>R$15</span></div>
<div class="servico"><label><input type="checkbox" data-preco="40" value="Pigmentação"> Pigmentação</label><span>R$40</span></div>
<div class="servico"><label><input type="checkbox" data-preco="20" value="Sobrancelha"> Sobrancelha</label><span>R$20</span></div>

<div class="total" id="total">Total: R$0</div>

<label>Data</label>
<input type="date" id="data">

<label>Horário</label>
<div class="horarios" id="horarios"></div>

<button onclick="agendar()">Agendar</button>
</div>

<script>
const horariosFixos = ["09:00","10:00","11:00","14:00","15:00","16:00"];
let horarioSelecionado = null;

document.querySelectorAll("input[type=checkbox]").forEach(c => c.onchange = calcular);
document.getElementById("data").addEventListener("change", validarDia);

function calcular() {
  let total = 0;
  document.querySelectorAll("input[type=checkbox]").forEach(c => {
    if (c.checked) total += Number(c.dataset.preco);
  });
  document.getElementById("total").innerText = "Total: R$" + total;
}

function validarDia() {
  const data = document.getElementById("data").value;
  if (!data) return;

  const dia = new Date(data + "T00:00").getDay();
  if (dia === 0 || dia === 1) {
    alert("Não funciona domingo e segunda-feira.");
    document.getElementById("data").value = "";
    document.getElementById("horarios").innerHTML = "";
    return;
  }
  carregarHorarios();
}

function carregarHorarios() {
  const div = document.getElementById("horarios");
  div.innerHTML = "";
  horarioSelecionado = null;

  const data = document.getElementById("data").value;
  const agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

  horariosFixos.forEach(h => {
    const ocupado = agendamentos.some(a => a.data === data && a.hora === h);
    const btn = document.createElement("button");
    btn.textContent = h;
    btn.className = "horario " + (ocupado ? "ocupado" : "livre");

    if (!ocupado) {
      btn.onclick = () => selecionar(btn, h);
    }

    div.appendChild(btn);
  });
}

function selecionar(btn, h) {
  document.querySelectorAll(".horario").forEach(b => b.classList.remove("selecionado"));
  btn.classList.add("selecionado");
  horarioSelecionado = h;
}

function agendar() {
  const nome = document.getElementById("nome").value.trim();
  const data = document.getElementById("data").value;

  if (!nome || !data || !horarioSelecionado) {
    alert("Preencha todos os campos");
    return;
  }

  const agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];

  const conflito = agendamentos.some(a => a.data === data && a.hora === horarioSelecionado);
  if (conflito) {
    alert("Horário já ocupado!");
    carregarHorarios();
    return;
  }

  agendamentos.push({
    nome,
    data,
    hora: horarioSelecionado,
    criadoEm: new Date().toISOString()
  });

  localStorage.setItem("agendamentos", JSON.stringify(agendamentos));

  alert("Agendamento confirmado!");
  carregarHorarios();
}
</script>

</body>
</html>
