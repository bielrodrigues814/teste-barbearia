<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda do Barbeiro</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #43cea2, #185a9d);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.container {
  margin-top: 230px;
  width: 100%;
  max-width: 520px;
  background: #fff;
  padding: 28px;
  border-radius: 22px;
  box-shadow: 0 20px 45px rgba(0,0,0,0.25);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.data-atual {
  text-align: center;
  font-weight: bold;
  color: #1abc9c;
  margin-bottom: 18px;
}

input[type="date"] {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 2px solid #ddd;
  font-size: 16px;
  margin-bottom: 22px;
}

.agendamento {
  background: #f7f9fb;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 16px;
  border-left: 6px solid #1abc9c;
}

.hora {
  font-size: 20px;
  font-weight: bold;
}

button {
  margin-top: 14px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #ff5f6d, #ffc371);
  color: #fff;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>Agenda do Barbeiro</h1>
  <div class="data-atual" id="dataTexto"></div>
  <input type="date" id="data">
  <div id="lista"></div>
</div>

<script>
const dataInput = document.getElementById("data");
const lista = document.getElementById("lista");
const dataTexto = document.getElementById("dataTexto");

const hoje = new Date();
dataInput.value = hoje.toISOString().split("T")[0];

dataInput.addEventListener("change", carregarAgenda);
carregarAgenda();

function carregarAgenda() {
  lista.innerHTML = "";

  const data = dataInput.value;
  dataTexto.innerText = "Data: " + data.split("-").reverse().join("/");

  const agendamentos = JSON.parse(localStorage.getItem("agendamentos")) || [];
  const doDia = agendamentos.filter(a => a.data === data);

  if (!doDia.length) {
    lista.innerHTML = "<p>Nenhum agendamento para este dia</p>";
    return;
  }

  doDia.forEach(a => {
    const div = document.createElement("div");
    div.className = "agendamento";

    div.innerHTML = `
      <div class="hora">⏰ ${a.hora}</div>
      <div>👤 Cliente: ${a.nome}</div>
      <div>✂️ Serviços: ${a.servicos ? a.servicos.join(", ") : "Não informado"}</div>
      <div>💰 Total: R$ ${a.total ?? "0"}</div>
      <button onclick="excluir('${a.data}','${a.hora}')">Excluir</button>
    `;

    lista.appendChild(div);
  });
}

function excluir(data, hora) {
  if (!confirm("Excluir este agendamento?")) return;

  let ag = JSON.parse(localStorage.getItem("agendamentos")) || [];
  ag = ag.filter(a => !(a.data === data && a.hora === hora));

  localStorage.setItem("agendamentos", JSON.stringify(ag));
  carregarAgenda();
}
</script>

</body>
</html>
